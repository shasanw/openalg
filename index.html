<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Installable app (#26): manifest for Chrome/Edge, Apple tags for iPad
         Safari "Add to Home Screen". Installed apps keep their storage. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#008236" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OpenAlg" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>OpenAlg</title>
    <script>
      // Apply the saved theme before first paint so there's no flash of the
      // wrong mode. Mirrors the logic in src/lib/useTheme.ts.
      (function () {
        try {
          // Dark is the default; only an explicit light choice turns it off.
          var t = localStorage.getItem("openalg-theme");
          document.documentElement.classList.toggle("dark", t !== "light");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
