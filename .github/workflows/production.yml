# Production deploys come only from release tags (issue #28). Pull requests,
# branches and main get Vercel preview/staging deployments through the Vercel
# Git integration; this workflow is the only path to production.
name: Production

on:
  push:
    tags: ["v*"]

concurrency:
  group: production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run
      - run: pnpm dlx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: pnpm dlx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}
      # The project has "auto-assign custom production domains" off, so pushes
      # to main build staged production deployments that never go live by
      # themselves. Promoting this one is what moves openalg.vercel.app.
      - name: Deploy and promote
        run: |
          url=$(pnpm dlx vercel@latest deploy --prebuilt --prod --skip-domain --token=${{ secrets.VERCEL_TOKEN }})
          pnpm dlx vercel@latest promote "$url" --yes --token=${{ secrets.VERCEL_TOKEN }}
