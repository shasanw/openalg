[package]
name = "openalg"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "openalg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- PDF pipeline (Typst + mitex) and native file dialogs ---
# NOTE: these crates' versions must stay mutually compatible (typst, typst-pdf,
# typst-assets, and the typst that typst-as-lib depends on must all resolve to
# the same minor). If `cargo build` complains about mismatched typst versions,
# align these and re-run. See src/pdf.rs for the compile entrypoint.
typst = "0.13"
typst-pdf = "0.13"
typst-assets = { version = "0.13", features = ["fonts"] }
typst-as-lib = "0.14"
mitex = "0.2"
rfd = "0.15"

